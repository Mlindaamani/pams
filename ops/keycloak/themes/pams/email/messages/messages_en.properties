eventUpdatePasswordBodyHtml=<div style="font-family:Inter,Roboto,Helvetica,Arial,sans-serif;color:#1f2937"><div style="background:#0b5cad;color:#fff;padding:20px 24px;font-size:24px;font-weight:800;letter-spacing:3px">PAMS</div><div style="padding:24px;border:1px solid #e0e4ea"><h2 style="color:#0b5cad">Password changed</h2><p>Your PAMS password was changed on {0} from {1}.</p><p style="color:#6b7280">If this was not you, contact your administrator.</p></div></div>
