# PAMS-branded Keycloak emails. Parent theme supplies any keys not overridden here.
passwordResetSubject=Reset your PAMS password
passwordResetBody=Someone requested a password reset for your PAMS account. Open this link to choose a new password:\n\n{0}\n\nThis link and code expire within {3}.\n\nIf you did not request this, ignore this message.\n\nPAMS Security
passwordResetBodyHtml=<div style="margin:0;padding:0;background:#f5f7fa;font-family:Inter,Roboto,Helvetica,Arial,sans-serif;color:#1f2937"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fa;padding:24px 12px"><tr><td align="center"><table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;border:1px solid #e0e4ea;border-radius:12px;overflow:hidden"><tr><td style="background:#0b5cad;padding:24px 32px"><div style="font-size:26px;font-weight:800;letter-spacing:3px;color:#fff">PAMS</div><div style="font-size:11px;font-weight:600;letter-spacing:1.6px;color:#c7dcf5;margin-top:4px">PROCUREMENT &amp; APPROVAL MANAGEMENT</div></td></tr><tr><td style="padding:32px"><h1 style="margin:0 0 12px;font-size:22px;color:#0b5cad">Reset your password</h1><p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#374151">Someone requested a password reset for your account. Choose a new password using the button below.</p><p style="margin:24px 0"><a href="{0}" style="display:inline-block;padding:13px 26px;border-radius:8px;background:#0b5cad;color:#fff;text-decoration:none;font-weight:700">Reset password</a></p><p style="margin:0 0 16px;font-size:13px;line-height:1.6;color:#6b7280">This link and code expire within {3}. If you did not request this change, you can safely ignore this message.</p><p style="margin:24px 0 0;font-size:14px;color:#374151">Regards,<br/><strong>PAMS Security</strong></p></td></tr></table></td></tr></table></div>
emailVerificationSubject=Verify your PAMS email
emailVerificationBody=Verify the email address on your PAMS account by opening this link:\n\n{0}\n\nThis link expires within {3}.\n\nIf you did not create this account, ignore this message.\n\nPAMS Security
emailVerificationBodyHtml=<div style="margin:0;padding:0;background:#f5f7fa;font-family:Inter,Roboto,Helvetica,Arial,sans-serif;color:#1f2937"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fa;padding:24px 12px"><tr><td align="center"><table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;border:1px solid #e0e4ea;border-radius:12px;overflow:hidden"><tr><td style="background:#0b5cad;padding:24px 32px"><div style="font-size:26px;font-weight:800;letter-spacing:3px;color:#fff">PAMS</div></td></tr><tr><td style="padding:32px"><h1 style="margin:0 0 12px;font-size:22px;color:#0b5cad">Verify your email</h1><p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#374151">Confirm your email address for your PAMS account.</p><p style="margin:24px 0"><a href="{0}" style="display:inline-block;padding:13px 26px;border-radius:8px;background:#0b5cad;color:#fff;text-decoration:none;font-weight:700">Verify email</a></p><p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280">This link expires within {3}. If you did not create this account, ignore this message.</p><p style="margin:24px 0 0;font-size:14px;color:#374151">Regards,<br/><strong>PAMS Security</strong></p></td></tr></table></td></tr></table></div>
executeActionsSubject=Action required for your PAMS account
executeActionsBody=Your administrator requested an account update: {3}.\n\nOpen this link to continue:\n\n{0}\n\nThis link expires within {4}.\n\nIf you were not expecting this, ignore this message.\n\nPAMS Security
executeActionsBodyHtml=<div style="margin:0;padding:0;background:#f5f7fa;font-family:Inter,Roboto,Helvetica,Arial,sans-serif;color:#1f2937"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fa;padding:24px 12px"><tr><td align="center"><table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;border:1px solid #e0e4ea;border-radius:12px;overflow:hidden"><tr><td style="background:#0b5cad;padding:24px 32px"><div style="font-size:26px;font-weight:800;letter-spacing:3px;color:#fff">PAMS</div></td></tr><tr><td style="padding:32px"><h1 style="margin:0 0 12px;font-size:22px;color:#0b5cad">Action required</h1><p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#374151">Your administrator requested an account update: <strong>{3}</strong>.</p><p style="margin:24px 0"><a href="{0}" style="display:inline-block;padding:13px 26px;border-radius:8px;background:#0b5cad;color:#fff;text-decoration:none;font-weight:700">Update account</a></p><p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280">This link expires within {4}. If you were not expecting this, ignore this message.</p><p style="margin:24px 0 0;font-size:14px;color:#374151">Regards,<br/><strong>PAMS Security</strong></p></td></tr></table></td></tr></table></div>
