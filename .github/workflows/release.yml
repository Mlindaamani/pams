name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build, scan and publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: web
            context: ./frontend
          - component: keycloak
            context: ./keycloak-theme
    steps:
      - uses: actions/checkout@v4

      - name: Set image coordinates
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          version_tag="${GITHUB_REF_NAME//\//-}"
          echo "IMAGE=ghcr.io/$owner/$repo-${{ matrix.component }}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=$version_tag" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.VERSION_TAG }}

      - name: Scan image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish immutable image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$VERSION_TAG"

      - name: Summary
        run: |
          {
            echo "### Published images"
            echo ""
            echo "- \`$IMAGE:$GITHUB_SHA\`"
            echo "- \`$IMAGE:$VERSION_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
