name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (verify, scan, image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (format, compile, unit + Testcontainers tests)
        run: ./mvnw -B verify

      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build backend image
        run: docker build -t pams-backend:ci .

  frontend:
    name: Frontend (lint, tests, build, scan, image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and format
        run: |
          npm run lint
          npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build frontend image
        run: docker build -t pams-web:ci .
